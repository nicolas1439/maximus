<!doctype html>
<html lang="es" data-inicio="registro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maximus — Crear cuenta</title>
  <script>try { if (localStorage.getItem('tema') === 'oscuro') document.documentElement.dataset.tema = 'oscuro'; } catch {}</script>
  <script type="module" src="js/incluir.js"></script>
</head>
<body>

  <!-- Página completa de Crear cuenta: header + plantilla de acceso (acceso.html, que abre en el registro por data-inicio) + footer.
       Como index.html, no tiene código propio: js/incluir.js arma la página desde los archivos de cada parte. -->
  <div data-incluir="header.html"></div>
  <div data-incluir="acceso.html"></div>
  <div data-incluir="footer.html"></div>

</body>
</html>
